[workspace.package]
version = "1.10.0-alpha.3"
authors = [
    "William Brown <william@blackhats.net.au>",
    "James Hodgkinson <james@terminaloutcomes.com>",
]
rust-version = "1.93"
edition = "2021"
license = "MPL-2.0"
homepage = "https://github.com/kubidm/kubidm/"
repository = "https://github.com/kubidm/kubidm/"

[workspace]
resolver = "2"
members = [
    "proto",
    "tools/cli",
    "tools/device_flow",
    "tools/iam_migrations/freeipa",
    "tools/iam_migrations/ldap",
    "tools/orca",
    "unix_integration/common",
    "unix_integration/nss_sparkle_common",
    "unix_integration/nss_kubidm",
    "unix_integration/nss_sparkle",
    "unix_integration/pam_sparkle_common",
    "unix_integration/pam_kubidm",
    "unix_integration/pam_sparkle",
    "unix_integration/resolver_common",
    "unix_integration/resolver",
    "server/daemon",
    "server/lib",
    "server/lib-macros",
    "server/core",
    "server/testkit",
    "server/testkit-macros",
    "libs/client",
    "libs/crypto",
    "libs/file_permissions",
    "libs/profiles",
    "libs/scim_proto",
    "libs/sketching",
    "libs/users",
    "tools/mail_sender",
]

[profile.release]
debug = true
strip = "none"
lto = "thin"
opt-level = 3
codegen-units = 32

[profile.release.build-override]
debug = false
opt-level = 0
codegen-units = 256

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true
lto = false
opt-level = 0
codegen-units = 256

[profile.dev.build-override]
debug = true
opt-level = 0
codegen-units = 256

[patch.crates-io]

[workspace.dependencies]
kubidmd_core = { path = "./server/core", version = "=1.10.0-alpha.3" }
kubidmd_lib = { path = "./server/lib", version = "=1.10.0-alpha.3" }
kubidmd_lib_macros = { path = "./server/lib-macros", version = "=1.10.0-alpha.3" }
kubidmd_testkit = { path = "./server/testkit", version = "=1.10.0-alpha.3" }
kubidm_build_profiles = { path = "./libs/profiles", version = "=1.10.0-alpha.3" }
kubidm_client = { path = "./libs/client", version = "=1.10.0-alpha.3" }
kubidm_lib_crypto = { path = "./libs/crypto", version = "=1.10.0-alpha.3" }
kubidm_lib_file_permissions = { path = "./libs/file_permissions", version = "=1.10.0-alpha.3" }
kubidm_proto = { path = "./proto", version = "=1.10.0-alpha.3" }
kubidm_unix_common = { path = "./unix_integration/common", version = "=1.10.0-alpha.3" }
kubidm_utils_users = { path = "./libs/users", version = "=1.10.0-alpha.3" }
scim_proto = { path = "./libs/scim_proto", version = "=1.10.0-alpha.3" }
sketching = { path = "./libs/sketching", version = "=1.10.0-alpha.3" }
sparkle_unix_common = { path = "./unix_integration/common", version = "=1.10.0-alpha.3" }
sparkle_resolver_common = { path = "./unix_integration/resolver_common", version = "=1.10.0-alpha.3" }
nss_sparkle_common = { path = "./unix_integration/nss_sparkle_common", version = "=1.10.0-alpha.3" }
pam_sparkle_common = { path = "./unix_integration/pam_sparkle_common", version = "=1.10.0-alpha.3" }

kanidm-hsm-crypto = { version = "^0.3.5" }

anyhow = { version = "1.0.102" }
argon2 = { version = "0.5.3", features = ["alloc"] }
