[package]
name = "kubidm_unix_int"
description = "Kubidm Unix Integration Clients"
documentation = "https://docs.rs/kubidm/latest/kubidm/"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[features]
default = ["unix"]
unix = []
selinux = ["kubidm_unix_common/selinux"]
tpm = ["kanidm-hsm-crypto/tpm", "kubidm_unix_common/tpm"]
dhat-heap = ["dep:dhat"]
dhat-ad-hoc = ["dep:dhat"]

[[bin]]
name = "kubidm_unixd"
path = "src/bin/kubidm_unixd.rs"
required-features = ["unix"]
test = false
doctest = false

[[bin]]
name = "kubidm_unixd_tasks"
path = "src/bin/kubidm_unixd_tasks.rs"
required-features = ["unix"]
test = false
doctest = false

[[bin]]
name = "kubidm_ssh_authorizedkeys"
path = "src/bin/kubidm_ssh_authorizedkeys.rs"
required-features = ["unix"]
test = false
doctest = false

[[bin]]
name = "kubidm-unix"
path = "src/bin/kubidm-unix.rs"
required-features = ["unix"]
test = false
doctest = false

[lib]
name = "kubidm_unix_resolver"
path = "src/lib.rs"
test = true
doctest = false

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dialoguer = { workspace = true }
dhat = { workspace = true, optional = true }
futures = { workspace = true }
hashbrown = { workspace = true }
libc = { workspace = true }
lru = { workspace = true }
kubidm_client = { workspace = true }
kubidm_proto = { workspace = true }
kanidm-hsm-crypto = { workspace = true }
kubidm_lib_crypto = { workspace = true }
kubidm_lib_file_permissions = { workspace = true }
kubidm_unix_common = { workspace = true }
notify-debouncer-full = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sketching = { workspace = true }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "fs",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
sd-notify = { workspace = true }
prctl = { workspace = true }
procfs = { workspace = true }

[target.'cfg(not(target_family = "windows"))'.dependencies]
kubidm_utils_users = { workspace = true }

[dev-dependencies]
kubidmd_core = { workspace = true }
kubidmd_testkit = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
kubidm_build_profiles = { workspace = true }

## Debian packaging
# We only package unixd itself here as shared libraries must be packaged separarately due to multiarch rules.
[package.metadata.deb]
name = "kubidm-unixd"
maintainer = "James Hodgkinson <james@terminaloutcomes.com>"
depends = [
	"libc6",
	"tpm-udev",
	"libpam-kubidm",
	"libnss-kubidm"
]
section = "network"
priority = "optional"
changelog = "../../target/debian/changelog"  # Generated by platform/debian/build_debs.sh
assets = [
    [ "target/release/kubidm_ssh_authorizedkeys", "usr/sbin/", "755" ],
    [ "target/release/kubidm_unixd_tasks", "usr/sbin/", "755" ],
    [ "target/release/kubidm_unixd", "usr/sbin/", "755" ],
    [ "target/release/kubidm-unix", "usr/sbin/", "755" ],
    [ "../../examples/unixd-safe-default", "etc/kubidm/unixd", "644" ],
    [ "../../examples/kubidm-safe-default", "etc/kubidm/config", "644" ],
    [ "../../examples/kubidm", "usr/share/kubidm-unixd/", "444" ],
    [ "../../examples/unixd", "usr/share/kubidm-unixd/", "444" ],
    [ "../../examples/sshd-config.conf", "etc/ssh/sshd_config.d/10-kubidm.conf", "644"],
]
maintainer-scripts = "debian/"
systemd-units = [
	{ unit-name = "kubidm-unixd", enable = true},
	{ unit-name = "kubidm-unixd-tasks", enable = true},
]

[package.metadata.cargo-machete]
ignored = ["kubidm_build_profiles", "clap_complete"]