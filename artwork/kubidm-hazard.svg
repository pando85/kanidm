<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="752"
   height="635"
   viewBox="0 0 752 635"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Kubidm Hazard</title>
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hazardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc3300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hazard diamond -->
  <path d="M 376,50 L 702,317.5 L 376,585 L 50,317.5 Z" 
        style="fill:url(#hazardGradient);stroke:#000000;stroke-width:8;stroke-linejoin:round" />
  
  <!-- Skull symbol -->
  <g transform="translate(276, 180)">
    <ellipse cx="100" cy="80" rx="80" ry="70" fill="#ffffff"/>
    <ellipse cx="65" cy="60" rx="20" ry="25" fill="#000000"/>
    <ellipse cx="135" cy="60" rx="20" ry="25" fill="#000000"/>
    <path d="M 70,110 Q 100,140 130,110" stroke="#000000" stroke-width="8" fill="none"/>
    <rect x="70" y="130" width="15" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="95" y="130" width="15" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="120" y="130" width="15" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  </g>
  
  <!-- Small Kubidm logo in corner -->
  <g transform="translate(600, 520) scale(0.5)">
    <path
       d="M 50,8 C 22,18 8,33 8,50 c 0,25 42,42 42,42 c 0,0 42,-17 42,-42 C 92,33 78,18 50,8 Z"
       style="fill:url(#shieldGradient);stroke:#1a3a5c;stroke-width:2;stroke-linejoin:round" />
    <path
       d="M 50,22 c -6,0 -12,6 -12,12 c 0,5 3,9 8,11 l 0,28 l 4,4 l 4,-4 l 0,-28 c 5,-2 8,-6 8,-11 c 0,-6 -6,-12 -12,-12 z M 50,28 a 6,6 0 1 1 0,12 a 6,6 0 1 1 0,-12 z"
       style="fill:#ffffff;stroke:#1a3a5c;stroke-width:1.5;stroke-linejoin:round" />
  </g>
</svg>