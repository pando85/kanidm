<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="755"
   height="638"
   viewBox="0 0 755 638"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Kubidm Warning</title>
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Warning triangle -->
  <path d="M 377.5,50 L 705,600 L 50,600 Z" 
        style="fill:#ffcc00;stroke:#000000;stroke-width:8;stroke-linejoin:round" />
  
  <!-- Exclamation mark -->
  <rect x="350" y="200" width="55" height="220" rx="10" fill="#000000"/>
  <circle cx="377.5" cy="500" r="35" fill="#000000"/>
  
  <!-- Small Kubidm logo in corner -->
  <g transform="translate(580, 530) scale(0.5)">
    <path
       d="M 50,8 C 22,18 8,33 8,50 c 0,25 42,42 42,42 c 0,0 42,-17 42,-42 C 92,33 78,18 50,8 Z"
       style="fill:url(#shieldGradient);stroke:#1a3a5c;stroke-width:2;stroke-linejoin:round" />
    <path
       d="M 50,22 c -6,0 -12,6 -12,12 c 0,5 3,9 8,11 l 0,28 l 4,4 l 4,-4 l 0,-28 c 5,-2 8,-6 8,-11 c 0,-6 -6,-12 -12,-12 z M 50,28 a 6,6 0 1 1 0,12 a 6,6 0 1 1 0,-12 z"
       style="fill:#ffffff;stroke:#1a3a5c;stroke-width:1.5;stroke-linejoin:round" />
  </g>
</svg>