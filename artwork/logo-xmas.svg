<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="875"
   height="875"
   viewBox="0 0 875 875"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Kubidm Christmas Logo</title>
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d40000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Snowflakes background -->
  <circle cx="100" cy="100" r="15" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="50" r="10" fill="#ffffff" opacity="0.7"/>
  <circle cx="750" cy="150" r="12" fill="#ffffff" opacity="0.8"/>
  <circle cx="650" cy="80" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="700" r="10" fill="#ffffff" opacity="0.7"/>
  <circle cx="800" cy="600" r="15" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="800" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="700" cy="750" r="12" fill="#ffffff" opacity="0.7"/>
  
  <!-- Main shield logo scaled to fit -->
  <g transform="translate(175, 175) scale(2.5)">
    <path
       id="shield"
       d="M 175,27 C 78,69 27,117 27,175 c 0,87 147,147 147,147 c 0,0 147,-60 147,-147 C 322,117 270,69 175,27 z"
       style="fill:url(#shieldGradient);stroke:#1a3a5c;stroke-width:5;stroke-linejoin:round;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1" />
    <path
       id="key"
       d="M 175,78 c -22,0 -41,19 -41,41 c 0,16 11,33 27,38 l 0,100 l 14,14 l 14,-14 l 0,-100 c 16,-5 27,-22 27,-38 c 0,-22 -19,-41 -41,-41 z M 175,100 a 20,20 0 1 1 0,41 a 20,20 0 1 1 0,-41 z"
       style="fill:#ffffff;stroke:#1a3a5c;stroke-width:4;stroke-linejoin:round;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1" />
  </g>
  
  <!-- Santa hat on top -->
  <path d="M 200,175 C 200,175 250,50 450,80 L 450,175 Z" style="fill:url(#hatGradient);stroke:#aa0000;stroke-width:2"/>
  <ellipse cx="450" cy="80" rx="50" ry="30" fill="#ffffff"/>
  <ellipse cx="200" cy="175" rx="30" ry="15" fill="#ffffff"/>
  
  <!-- Christmas lights around shield -->
  <circle cx="175" cy="175" r="8" fill="#ff0000"/>
  <circle cx="200" cy="250" r="8" fill="#ffff00"/>
  <circle cx="250" cy="300" r="8" fill="#00ff00"/>
  <circle cx="350" cy="350" r="8" fill="#ff00ff"/>
  <circle cx="450" cy="350" r="8" fill="#ff0000"/>
  <circle cx="550" cy="350" r="8" fill="#ffff00"/>
  <circle cx="650" cy="300" r="8" fill="#00ff00"/>
  <circle cx="700" cy="250" r="8" fill="#ff00ff"/>
  <circle cx="700" cy="175" r="8" fill="#ff0000"/>
</svg>