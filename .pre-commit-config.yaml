repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
        exclude: \.(rs|in)$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: \.(rs|in)$
      - id: end-of-file-fixer
        exclude: ^(pykanidm/kanidm_openapi_client/|book/src/|server/core/static/external/|server/core/templates/|examples/|tools/orca/|unix_integration/nss_kanidm/src/|scripts/otel/|server/lib/src/constants/|server/lib/src/plugins/|tools/device_flow/src/|tools/iam_migrations/|\.rst$|\.map$|\.min\.(js|css)$|\.json$|\.svg$|\.editorconfig$)
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ^(pykanidm/kanidm_openapi_client/|book/src/|server/core/static/external/|server/core/templates/|examples/|tools/orca/|\.rst$|\.map$|\.min\.(js|css)$|\.json$|\.svg$)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: shellcheck
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.102.3
    hooks:
      - id: renovate-config-validator
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt
        description: Format Rust code with cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        description: Lint Rust code with cargo clippy
        entry: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all-targets", "--all-features", "--", "-D", "warnings"]