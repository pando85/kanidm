name: Vendor Rive runtime once

on:
  push:
    branches:
      - agent/adr-mascot-guided-experience
    paths:
      - .github/workflows/vendor-rive-once.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adr-mascot-guided-experience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vendor pinned canvas-lite runtime
        working-directory: server/core
        run: node scripts/vendor_rive.mjs
      - name: Commit vendored runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/core/static/rive
          if git diff --cached --quiet; then
            echo "Rive runtime already vendored"
            exit 0
          fi
          git commit -m "build(ui): vendor pinned Rive canvas-lite runtime"
          git push origin HEAD:agent/adr-mascot-guided-experience
