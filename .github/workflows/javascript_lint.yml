---
name: Javascript Linting
"on":
  - push
  - pull_request
jobs:
  javascript_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Run ESLint to check browser Javascript files
        run: make eslint
      - name: Lint guide test and build scripts
        working-directory: server/core
        run: pnpm exec eslint tests scripts
      - name: Run Prettier to check Javascript files
        run: make prettier
      - name: Validate mascot Rive binding semantics
        working-directory: server/core
        run: node --test tests/guide/guide_rive_binding.test.mjs
      - name: Validate mascot Rive machine contract
        if: always()
        working-directory: server/core
        run: node --test tests/guide/guide_rive_contract.test.mjs
      - name: Validate mascot Rive assets
        if: always()
        working-directory: server/core
        run: node --test tests/guide/guide_rive_assets.test.mjs
