---
name: Pre-commit

'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit (skip Rust hooks - run in separate jobs)
        run: SKIP=fmt,clippy pre-commit run --all-files --verbose

  apply-production-readiness-fixes:
    if: github.event.pull_request.head.ref == 'sync/upstream-parity-2026-08-26'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: sync/upstream-parity-2026-08-26

      - name: Apply migration-safe UUID and OAuth fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          uuids = Path("server/lib/src/constants/uuids.rs")
          text = uuids.read_text()
          old_signup = 'pub const UUID_ACCOUNT_SIGNUP_FEATURE: Uuid = uuid!("00000000-0000-0000-0000-000000000059");'
          new_signup = 'pub const UUID_ACCOUNT_SIGNUP_FEATURE: Uuid = uuid!("00000000-0000-0000-0000-000000000063");'
          old_approval = 'pub const UUID_IDM_APPROVAL_ADMINS: Uuid = uuid!("00000000-0000-0000-0000-000000000063");'
          new_approval = 'pub const UUID_IDM_APPROVAL_ADMINS: Uuid = uuid!("00000000-0000-0000-0000-000000000059");'
          if old_signup not in text or old_approval not in text:
              raise SystemExit("expected UUID allocation state not found")
          text = text.replace(old_signup, new_signup, 1).replace(old_approval, new_approval, 1)
          uuids.write_text(text)

          oauth = Path("server/lib/src/idm/oauth2.rs")
          text = oauth.read_text()
          old = '''        // Always clear query and fragment, regardless of the response mode
          redirect_uri.set_query(None);
          redirect_uri.set_fragment(None);

          // We can't set query pairs on fragments, only query.
          let encoded = url::form_urlencoded::Serializer::new(String::new())
              .append_pair("error", self.error.as_ref())
              .finish();

          match self.response_mode {
              SupportedResponseMode::Query => redirect_uri.set_query(Some(&encoded)),
              SupportedResponseMode::Fragment => redirect_uri.set_fragment(Some(&encoded)),
          }
'''
          new = '''        // A registered redirect URI may contain a query component. RFC 6749
          // requires it to be retained while response parameters are appended.
          // Registered redirect URIs cannot contain fragments, but clear one defensively.
          redirect_uri.set_fragment(None);

          match self.response_mode {
              SupportedResponseMode::Query => {
                  let mut pairs = redirect_uri.query_pairs_mut();
                  pairs.append_pair("error", self.error.as_ref());
                  if let Some(state) = self.state.as_ref() {
                      pairs.append_pair("state", state);
                  }
              }
              SupportedResponseMode::Fragment => {
                  let mut serializer = url::form_urlencoded::Serializer::new(String::new());
                  serializer.append_pair("error", self.error.as_ref());
                  if let Some(state) = self.state.as_ref() {
                      serializer.append_pair("state", state);
                  }
                  redirect_uri.set_fragment(Some(&serializer.finish()));
              }
          }
'''
          if old not in text:
              raise SystemExit("expected AuthoriseReject::build_redirect_uri block not found")
          text = text.replace(old, new, 1)

          marker = '''#[derive(Clone)]
          struct CtSecret {
'''
          tests = '''#[cfg(test)]
          mod authorise_reject_tests {
              use super::*;

              #[test]
              fn query_response_preserves_redirect_query_and_state() {
                  let rejection = AuthoriseReject {
                      redirect_uri: Url::parse("https://client.example/callback?tenant=acme").unwrap(),
                      state: Some("csrf-state".to_string()),
                      error: Oauth2Error::AccessDenied,
                      response_mode: SupportedResponseMode::Query,
                  };

                  assert_eq!(
                      rejection.build_redirect_uri().as_str(),
                      "https://client.example/callback?tenant=acme&error=access_denied&state=csrf-state"
                  );
              }

              #[test]
              fn fragment_response_preserves_redirect_query_and_state() {
                  let rejection = AuthoriseReject {
                      redirect_uri: Url::parse("https://client.example/callback?tenant=acme").unwrap(),
                      state: Some("csrf-state".to_string()),
                      error: Oauth2Error::InteractionRequired,
                      response_mode: SupportedResponseMode::Fragment,
                  };

                  assert_eq!(
                      rejection.build_redirect_uri().as_str(),
                      "https://client.example/callback?tenant=acme#error=interaction_required&state=csrf-state"
                  );
              }
          }

          #[derive(Clone)]
          struct CtSecret {
'''
          if marker not in text:
              raise SystemExit("expected CtSecret marker not found")
          text = text.replace(marker, tests, 1)
          oauth.write_text(text)
          PY

          cargo fmt --all
          cargo test -p kubidmd_lib authorise_reject_tests --lib

          # Restore this workflow exactly to the base-branch version so the final
          # PR tree contains only source/test changes.
          git show origin/master:.github/workflows/pre-commit.yml > .github/workflows/pre-commit.yml

          git add server/lib/src/constants/uuids.rs server/lib/src/idm/oauth2.rs .github/workflows/pre-commit.yml
          git commit -m "fix: harden upstream sync for production upgrades"
          git push origin HEAD:sync/upstream-parity-2026-08-26
