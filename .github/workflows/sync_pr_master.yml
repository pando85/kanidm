---
name: Sync PR with master
"on":
  push:
    branches:
      - agent/adr-mascot-guided-experience
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adr-mascot-guided-experience
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Merge current master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          set +e
          git merge --no-edit origin/master
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            if git ls-files -u -- server/core/package.json | grep -q .; then
              git checkout --ours server/core/package.json
            fi
            if git ls-files -u -- server/core/pnpm-lock.yaml | grep -q .; then
              git checkout --ours server/core/pnpm-lock.yaml
            fi
            if git ls-files -u -- Cargo.lock | grep -q .; then
              git checkout --theirs Cargo.lock
            fi

            if git ls-files -u | grep -q .; then
              echo "Unexpected unresolved merge conflicts:"
              git status --short
              exit 1
            fi

            (cd server/core && pnpm install --lockfile-only)
            git add Cargo.lock server/core/package.json server/core/pnpm-lock.yaml
            git commit --no-edit
          fi

          git push origin HEAD:agent/adr-mascot-guided-experience
