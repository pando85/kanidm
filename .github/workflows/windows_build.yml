---
name: Windows Build and Test

# Trigger the workflow on push to master or pull request
"on":
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:  # so you can run it manually
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  KANIDM_BUILD_PROFILE: developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_build_kubidm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install OpenSSL
        shell: pwsh
        run: |
          $maxAttempts = 3
          $retryDelay = 30

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Write-Host "Attempt $attempt of $maxAttempts"
              vcpkg integrate install
              vcpkg install openssl:x64-windows-static-md
              Write-Host "vcpkg install succeeded"
              break
            }
            catch {
              if ($attempt -lt $maxAttempts) {
                Write-Host "Attempt $attempt failed. Retrying in $retryDelay seconds..."
                Start-Sleep -Seconds $retryDelay
              }
              else {
                Write-Host "All attempts failed."
                throw
              }
            }
          }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo build --locked -p kubidm_client -p kubidm_tools --bin kubidm
      # yamllint disable-line rule:line-length
      - run: cargo test -p kubidm_client -p kubidm_tools
