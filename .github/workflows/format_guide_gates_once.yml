---
name: Format guide gates once
"on":
  push:
    branches:
      - agent/adr-mascot-guided-experience
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adr-mascot-guided-experience
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        working-directory: server/core
        run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier formatting
        working-directory: server/core
        run: |
          pnpm exec prettier --write \
            tests/guide/guide_product_bindings.test.mjs \
            tests/guide/guide_authenticated_htmx.e2e.mjs \
            tests/guide/validate_release_readiness.mjs \
            tests/guide/measure_performance.mjs
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/core/tests/guide/guide_product_bindings.test.mjs \
            server/core/tests/guide/guide_authenticated_htmx.e2e.mjs \
            server/core/tests/guide/validate_release_readiness.mjs \
            server/core/tests/guide/measure_performance.mjs
          git commit -m "style(ui): format guide gate sources"
          git push origin HEAD:agent/adr-mascot-guided-experience
