name: Update Rive JS lock once

on:
  push:
    branches:
      - agent/adr-mascot-guided-experience
    paths:
      - .github/workflows/update-rive-lock-once.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adr-mascot-guided-experience
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Regenerate lockfile
        working-directory: server/core
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/core/pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(ui): lock Rive test dependencies"
          git push origin HEAD:agent/adr-mascot-guided-experience
