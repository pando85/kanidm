name: One-shot JavaScript repair

on:
  push:
    branches:
      - agent/adr-mascot-guided-experience

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/adr-mascot-guided-experience
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install JavaScript dependencies
        working-directory: server/core
        run: pnpm install --frozen-lockfile

      - name: Remove CSP-invalid UI Lab handlers and duplicate directive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui_lab = Path('server/core/static/modules/ui_lab.mjs')
          text = ui_lab.read_text()
          needle = ' onsubmit="return false"'
          assert text.count(needle) == 2, text.count(needle)
          ui_lab.write_text(text.replace(needle, ''))

          https_mod = Path('server/core/src/https/mod.rs')
          text = https_mod.read_text()
          duplicate = "            // https://datatracker.ietf.org/doc/html/rfc9700#name-clickjacking\n            \"frame-ancestors 'none'; \",\n"
          assert text.count(duplicate) == 2, text.count(duplicate)
          https_mod.write_text(text.replace(duplicate, ''))
          PY

      - name: Apply repository Prettier formatting
        working-directory: server/core
        run: pnpm exec prettier tests/guide/guide_authenticated_htmx.e2e.mjs static/modules/ui_lab.mjs --write

      - name: Verify JavaScript formatting and lint
        working-directory: server/core
        run: |
          pnpm exec eslint static tests scripts --no-warn-ignored
          pnpm run prettier

      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/agent-fix-js.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): satisfy JavaScript and CSP verification gates'
          git push origin HEAD:agent/adr-mascot-guided-experience
