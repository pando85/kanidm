<div data-guide-credential-step="passkey_enrolment">
    (% if crate::https::views::guide::guided_ui_full() %)
    <section class="crab-dialog" data-variant="orient" data-guide-story-id="passkey-enrolment-name">
        <strong class="crab-dialog-title">Your device does the sensitive part</strong>
        <p>Approve the passkey with your browser or device, then give it a name you’ll recognise later. The name is only for managing your credentials.</p>
    </section>
    (% endif %)
    <div class="row" id="staticPasskeyCreateRow">
        <!-- Safari requires a human input to start passkey creation -->
        <div id="passkeyNamingSafariPre">
            <button id="passkeyNamingSafariBtn" class="btn btn-primary" data-guide-target="primary-action">Begin Passkey Enrolment</button>
            <div class="d-flex justify-content-end pt-3 g-3" hx-target="#credentialUpdateDynamicSection">
               <button id="password-cancel" type="button" class="btn btn-danger" hx-post="/ui/api/cancel_mfareg">Cancel</button>
            </div>
        </div>

        <form
            id="passkeyNamingForm"
            class="g-2 d-none"
            data-challenge="(( challenge ))"
            >

            <b>Adding a new passkey</b>
            <label for="passkey-label" class="form-label">Please name this Passkey</label>
            <input type="text" name="name" id="passkey-label" autofocus required class="form-control">

            <input hidden type="text" name="creationData" id="passkey-create-data">

            <div class="d-flex justify-content-end pt-3 g-3" hx-target="#credentialUpdateDynamicSection">
                <button id="password-cancel" type="button" class="btn btn-danger" hx-post="/ui/api/cancel_mfareg">Cancel</button>
                <button
                        type="submit"
                        hx-post="/ui/api/finish_passkey"
                        hx-vals='{"class": "(( class ))"}'
                        id="passkeyNamingSubmitBtn"
                        class="btn btn-primary d-none ms-2" disabled
                        data-guide-target="primary-action"
                >Add</button>
            </div>
        </form>
    </div>
</div>
